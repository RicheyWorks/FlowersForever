# Fail-closed headless container profile. Docker activates this automatically.
# Supply either FLOWERFARM_AUTH_USERS or both fallback username/password variables.

server.address=0.0.0.0
flowerfarm.auth.enabled=true
flowerfarm.auth.allow-demo-credentials=false

flowerfarm.auth.users=${FLOWERFARM_AUTH_USERS:}
flowerfarm.auth.username=${FLOWERFARM_AUTH_USERNAME:farm}
flowerfarm.auth.password=${FLOWERFARM_AUTH_PASSWORD:}

# FlowersForever update publisher keys (Ed25519 PUBLIC keys only).
#
# The app accepts an update manifest or installer only when it is signed by
# one of the keys below. Format: label=<base64 X.509 public key>. The key id
# shown by the release tool is derived from the key itself.
#
# Empty on purpose: until RicheyWorks adds the production public key, update
# checks report "not set up to receive updates yet" and make no network call.
#
# To add the production key (see docs/AUTO_UPDATES.md, "Signing key"):
#   1. pwsh scripts/update-release.ps1 keygen --out "$env:USERPROFILE\FlowersForever-signing\update-signing.key"
#      (outside any git checkout; the tool refuses otherwise)
#   2. Paste the printed "richeyworks-YYYY-MM-DD=..." line below and commit it.
#   3. Back up the private key offline. NEVER commit, email, or upload it.
#
# For a planned key change, list the old and new keys together for one release.

# ── Server ────────────────────────────────────────────────────────────────────
spring.config.import=optional:file:./application-local.properties
server.port=8080
# Open desktop mode is local-only. Use the auth profile or an explicit override for LAN access.
server.address=127.0.0.1

# ── JSON ──────────────────────────────────────────────────────────────────────
# Spring Boot 4 prefers Jackson 3; keep REST JSON on the Jackson 2 mapper the app is written for.
spring.http.converters.preferred-json-mapper=jackson2

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.flowerfarm=INFO

# ── Persistence (file H2 — survives restarts; portable with the app) ──────────
# Developer JAR: ./data. Native Windows package: %LOCALAPPDATA%/FlowersForever/data.
# Override with FLOWERFARM_DATA_DIR or -Dflowerfarm.data-dir when required.
# AppDataBootstrap binds H2's same-computer AUTO_SERVER listener to loopback by
# default; an explicit -Dh2.bindAddress overrides that JVM setting.
spring.datasource.url=jdbc:h2:file:${flowerfarm.data-dir:./data}/flowerfarm;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false

# ── Versioned schema upgrades ────────────────────────────────────────────────
# Existing pre-1.1 databases are baselined at V1, then upgraded in place.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Legacy 1.0 schema
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# Optional CSV used only when the database is empty on first start
flowerfarm.inventory.seed-csv=farm_inventory.csv

# REST-triggered CSV exports are confined beneath this directory.
flowerfarm.exports.directory=${flowerfarm.data-dir:./data}/exports

# Immutable production-task photos live beside the database so normal backup and
# restore includes both their metadata and content.
flowerfarm.attachments.directory=${flowerfarm.data-dir:./data}/attachments
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=17MB

# ── Farm identity ────────────────────────────────────────────────────────────
# Customer-owned branding used by the desktop shell, invoices, statements, and
# farm reports. Override these in application-local.properties or with the
# corresponding FLOWERFARM_PROFILE_* environment variables.
flowerfarm.profile.name=${FLOWERFARM_PROFILE_NAME:Your Farm}
flowerfarm.profile.location=${FLOWERFARM_PROFILE_LOCATION:}
flowerfarm.profile.tagline=${FLOWERFARM_PROFILE_TAGLINE:Your farm, your records}
flowerfarm.profile.email=${FLOWERFARM_PROFILE_EMAIL:}
flowerfarm.profile.phone=${FLOWERFARM_PROFILE_PHONE:}
flowerfarm.profile.website=${FLOWERFARM_PROFILE_WEBSITE:}
flowerfarm.profile.time-zone=${FLOWERFARM_PROFILE_TIME_ZONE:America/Los_Angeles}

# ── Automatic updates (docs/AUTO_UPDATES.md) ─────────────────────────────────
# The desktop checks a small signed manifest over HTTPS when it opens and from
# Help > Check for updates. With no manifest URL (the default) or no built-in
# publisher key, it makes no network call. The farm can also turn automatic
# checks off from Help > Check for updates.
flowerfarm.updates.enabled=${FLOWERFARM_UPDATES_ENABLED:true}
flowerfarm.updates.manifest-url=${FLOWERFARM_UPDATES_MANIFEST_URL:https://richeyworks.github.io/FlowersForever-updates/latest.json}
# owner (sees releases first), early (one pilot tester), or stable (everyone)
flowerfarm.updates.channel=${FLOWERFARM_UPDATES_CHANNEL:stable}
flowerfarm.updates.check-on-launch=true

# ── Irrigation advisor (Port Orchard / Kitsap) ────────────────────────────────
# Live Open-Meteo forecast (no API key). Falls back to month climatology offline.
flowerfarm.irrigation.live-weather=true
flowerfarm.irrigation.latitude=47.5407
flowerfarm.irrigation.longitude=-122.6362

# ── Shared barn PC auth (off by default; use profile "auth" to enable) ────────
# Roles: OWNER (full), HAND (ops write), VIEWER (read-only REST)
# Format: user:pass:ROLE,user2:pass2:ROLE
flowerfarm.auth.enabled=false
flowerfarm.auth.allow-demo-credentials=false
flowerfarm.auth.users=
# Fallback single user when users list empty:
flowerfarm.auth.username=farm
flowerfarm.auth.password=

# ── Provider-neutral AI / automation harness (disabled by default) ───────────
# The REST adapter is excluded from CLI and release-smoke profiles. Container use
# remains opt-in and also requires the container profile's normal authentication.
# When enabled it still requires a separate 24+ character local token. Generic
# button activation is classified destructive and remains off unless both the
# mutation and destructive gates are explicitly enabled. Values and application
# pixels require their own default-denied sensitive-read gate. Future physical
# actions require mutation + destructive + physical gates and a short expiry.
flowerfarm.harness.enabled=${FLOWERFARM_HARNESS_ENABLED:false}
flowerfarm.harness.token=${FLOWERFARM_HARNESS_TOKEN:}
flowerfarm.harness.allow-sensitive-read=${FLOWERFARM_HARNESS_ALLOW_SENSITIVE_READ:false}
flowerfarm.harness.allow-navigation=${FLOWERFARM_HARNESS_ALLOW_NAVIGATION:true}
flowerfarm.harness.allow-drafts=${FLOWERFARM_HARNESS_ALLOW_DRAFTS:false}
flowerfarm.harness.allow-mutations=${FLOWERFARM_HARNESS_ALLOW_MUTATIONS:false}
flowerfarm.harness.allow-destructive=${FLOWERFARM_HARNESS_ALLOW_DESTRUCTIVE:false}
flowerfarm.harness.allow-physical-actions=${FLOWERFARM_HARNESS_ALLOW_PHYSICAL_ACTIONS:false}
# Optimus stays absent unless explicitly enabled. Only the simulator transport
# exists today; a future official/customer adapter should implement OptimusRobotAdapter.
flowerfarm.harness.optimus.enabled=${FLOWERFARM_OPTIMUS_ENABLED:false}
flowerfarm.harness.optimus.mode=${FLOWERFARM_OPTIMUS_MODE:unconfigured}
# Mandatory for a hardware adapter; optional for the explicit simulator.
flowerfarm.harness.optimus.expected-robot-id=${FLOWERFARM_OPTIMUS_EXPECTED_ROBOT_ID:}

# ══════════════════════════════════════════════════════════════════════════════
# CONNECTOR CONFIGURATION
# Fill in credentials here (or override in application-local.properties which
# is .gitignored).  Leave blank to disable a connector — each connector guards
# its own isAvailable() check.
# ══════════════════════════════════════════════════════════════════════════════

# ── CSV ───────────────────────────────────────────────────────────────────────
connector.csv.import-file=farm_inventory.csv
connector.csv.export-file=exported_inventory.csv
connector.csv.delimiter=,
connector.csv.col.name=Name
connector.csv.col.category=Category
connector.csv.col.price=Price
connector.csv.col.unit=Unit
connector.csv.col.cost=Cost
connector.csv.col.quantity=Quantity
connector.csv.col.notes=Notes

# ── Excel ─────────────────────────────────────────────────────────────────────
connector.excel.file=flower_inventory.xlsx

# ── Airtable ──────────────────────────────────────────────────────────────────
# Dual mode: local-file for offline demos, or api-key + base-id for live Airtable
connector.airtable.local-file=data/airtable-mirror.json
connector.airtable.api-key=
connector.airtable.base-id=
connector.airtable.table-name=Table 1

# ── Webhook (local dry-run file OR HTTP POST) ─────────────────────────────────
# Local file writes the outbound JSON payload for demos/CI (no network).
# Clear local-file and set url for live delivery. Optional HMAC secret.
connector.webhook.local-file=data/webhook-last-payload.json
connector.webhook.url=
connector.webhook.secret=

# ── Shopify (local JSON mirror OR Admin REST) ─────────────────────────────────
# Local mirror enables offline import/export/sync without Admin API credentials.
# Clear local-file and set shop-name + api-token for live REST.
connector.shopify.local-file=data/shopify-mirror.json
connector.shopify.shop-name=
connector.shopify.api-token=
connector.shopify.api-version=2024-01

# ── Square (local JSON mirror OR Catalog + Inventory APIs) ────────────────────
# Local mirror for offline POS demos. Clear local-file and set access-token for live.
connector.square.local-file=data/square-mirror.json
connector.square.access-token=
connector.square.location-id=
connector.square.environment=sandbox
connector.square.currency=USD

# ── Google Sheets (local JSON mirror OR Sheets API) ───────────────────────────
# Local mirror for offline demos. Clear local-file for live Sheets API.
# Live import: spreadsheet-id + api-key (public) OR access-token (private)
# Live export/sync: access-token required (OAuth). API keys are read-only.
connector.google-sheets.local-file=data/google-sheets-mirror.json
connector.google-sheets.spreadsheet-id=
connector.google-sheets.sheet-name=Inventory
connector.google-sheets.api-key=
connector.google-sheets.access-token=
connector.google-sheets.col.name=Name
connector.google-sheets.col.category=Category
connector.google-sheets.col.price=Price
connector.google-sheets.col.unit=Unit
connector.google-sheets.col.cost=Cost
connector.google-sheets.col.quantity=Quantity
connector.google-sheets.col.notes=Notes

# ── Farmbrite (local JSON mirror OR live REST) ────────────────────────────────
# Local mirror enables full offline import/export/sync demos (no credentials).
connector.farmbrite.local-file=data/farmbrite-mirror.json
connector.farmbrite.api-key=
connector.farmbrite.account-id=
connector.farmbrite.base-url=https://www.farmbrite.com/api/v1

# ── Floranext (local JSON mirror OR live REST) ────────────────────────────────
connector.floranext.local-file=data/floranext-mirror.json
connector.floranext.api-key=
connector.floranext.store-url=

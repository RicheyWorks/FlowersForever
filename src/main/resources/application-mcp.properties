# MCP is a local child-process transport. It has no HTTP listener or desktop UI.
spring.main.web-application-type=none
spring.main.headless=true
spring.main.banner-mode=off

# The MCP client supplies this process-only credential in its environment. It is
# never published as a tool argument or returned to the model.
flowerfarm.harness.enabled=true

# MCP reserves stdout for newline-delimited JSON-RPC messages. The MCP branch in
# logback-spring.xml routes application diagnostics to stderr.

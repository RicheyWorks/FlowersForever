# Activate with: --spring.profiles.active=auth
# (combine: --spring.profiles.active=auth,sqlite)

flowerfarm.auth.enabled=true
# Authenticated barn installs may accept LAN connections.
server.address=0.0.0.0
# Multi-user barn accounts (OWNER / HAND / VIEWER)
flowerfarm.auth.allow-demo-credentials=${FLOWERFARM_ALLOW_DEMO_CREDENTIALS:false}
flowerfarm.auth.users=${FLOWERFARM_AUTH_USERS:}
flowerfarm.auth.username=${FLOWERFARM_AUTH_USERNAME:farm}
flowerfarm.auth.password=${FLOWERFARM_AUTH_PASSWORD:}

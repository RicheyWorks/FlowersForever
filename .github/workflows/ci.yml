# FlowersForever — continuous verification on every push / PR (ADR-001)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Field entry and offline replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test field forms and durable device queue
        run: node --test scripts/worker-ui.test.mjs
      - name: Test private preview asset integrity and permissions
        run: node --test scripts/preview-release-assets.test.mjs
      - name: Test bounded native smoke behavior
        run: node --test scripts/test-macos-launchers.test.mjs
      - name: Test isolated Windows packaging and clean desktop shutdown
        run: node --test scripts/build-release.test.mjs scripts/test-desktop-launcher.test.mjs
      - name: Test harness evidence failure detection
        run: python3 -B -m unittest discover -s scripts -p test_verify_harness.py

  verify:
    name: mvn clean verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    # JDK 17 is the supported baseline; 21 is advisory forward-compat (Boot 4.x prep)
    continue-on-error: ${{ matrix.java == '21' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify harness and source-bound evidence (JDK 17)
        if: matrix.java == '17'
        run: python3 -B scripts/verify_harness.py

      - name: Build and test (advisory JDK 21)
        if: matrix.java == '21'
        run: mvn -B clean verify

      - name: Upload coverage report (JDK 17 only)
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload SBOM (JDK 17 only)
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/bom.*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packaged MCP reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-mcp-reports-jdk${{ matrix.java }}
          path: target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Static analysis (Medium gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: SpotBugs + Checkstyle
        run: mvn -B clean verify -Pquality -DskipTests

      - name: Upload analysis reports
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/checkstyle-result.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image (no push)
        run: docker build -t flowersforever:ci .

      - name: Smoke-test authenticated container profile
        run: |
          docker run -d --name flowersforever-ci -p 18080:8080 \
            -e FLOWERFARM_AUTH_USERS='owner:a-long-ci-password:OWNER' \
            flowersforever:ci
          for attempt in {1..45}; do
            health="$(docker inspect --format='{{.State.Health.Status}}' flowersforever-ci)"
            if [ "$health" = "healthy" ]; then
              break
            fi
            if [ "$health" = "unhealthy" ]; then
              docker logs flowersforever-ci
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' flowersforever-ci)" = "healthy"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/api/inventory)" = "401"

      - name: Container logs on failure
        if: failure()
        run: docker logs flowersforever-ci || true

      - name: Remove smoke container
        if: always()
        run: docker rm --force flowersforever-ci || true

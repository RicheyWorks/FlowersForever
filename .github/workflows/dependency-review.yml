# Block PRs that introduce known-vulnerable dependencies (ADR-001)
name: Dependency review

on:
  pull_request:
    branches: [main, codex/recover-unpushed-work]

permissions:
  contents: read

jobs:
  dependency-review:
    # GitHub's dependency-review API is available for public repositories.
    # Private copies skip this job without enabling a billable security feature.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

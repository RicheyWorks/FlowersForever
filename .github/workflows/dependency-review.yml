# Block PRs that introduce known-vulnerable dependencies (ADR-001)
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    # GitHub's dependency-review API requires Advanced Security on private
    # repositories. Keep the check for public mirrors without enabling a
    # potentially billable feature on this private repository.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
